<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(node_modules/@fontsource/inter/files/inter-latin-900-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script>
<script>
const W = 1080, H = 1920, END = 77.3;
const c = document.getElementById('c'), ctx = c.getContext('2d');

// ---------- palette: same underwater world as part 2, aqua/cyan accent for part 4 ----------
const P = {
  top: '#1e4250', mid: '#0f2430', bot: '#03080b',
  ray: '175,205,235', haze: '140,205,220',
  accent: '#7FE3E0', accentGlow: 'rgba(80,215,210,0.85)',
  title: '#F0FBFF', sub: 'rgba(218,234,242,0.85)',
  steel1: '#DCE0EA', steel2: '#7E8597',
  waterTop: 'rgba(110,175,205,0.88)', waterBot: 'rgba(36,82,120,0.94)',
  dirt: '#A88661', dirtHi: '#D2B48C',
  cl: '#CFEA72', clGlow: 'rgba(200,235,110,0.9)',
  microbe: 'rgba(232,150,196,0.9)', microbeEdge: '#F6C6E0',
};

// ---------- helpers ----------
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => (k = clamp(k), k * k * (3 - 2 * k));
const easeOut = k => (k = clamp(k), 1 - Math.pow(1 - k, 3));
const easeBack = k => { k = clamp(k); const s = 1.70158; return 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2); };
const appear = (t, t0, d = 0.45) => clamp((t - t0) / d);

function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

function text(str, x, y, o = {}) {
  const size = o.size || 60, weight = o.weight || 800;
  ctx.save();
  ctx.font = `${weight} ${size}px Inter`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic';
  if (o.maxW) { const m = ctx.measureText(str).width; if (m > o.maxW) { const s2 = size * o.maxW / m; ctx.font = `${weight} ${s2}px Inter`; } }
  ctx.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 34; ctx.fillStyle = o.color || '#fff'; ctx.fillText(str, x, y); ctx.shadowBlur = (o.blur || 34) * 0.4; ctx.fillText(str, x, y); }
  if (o.shadow) { ctx.shadowColor = o.shadow; ctx.shadowBlur = 14; ctx.shadowOffsetY = 3; }
  ctx.fillStyle = o.color || '#fff'; ctx.fillText(str, x, y);
  ctx.restore();
}

// ---------- background ----------
const R0 = rng(7);
const rays = Array.from({ length: 8 }, (_, i) => ({ x: 60 + i * 135 + R0() * 60, w: 60 + R0() * 120, a: 0.035 + R0() * 0.05, ph: R0() * 6, sk: 120 + R0() * 120 }));
const blobs = Array.from({ length: 7 }, () => ({ x: R0() * W, y: R0() * H * 0.8, r: 260 + R0() * 260, vx: (R0() - .5) * 14, vy: (R0() - .5) * 10, ph: R0() * 6 }));
const dust = Array.from({ length: 90 }, () => ({ x: R0() * W, y: R0() * H, r: 0.8 + R0() * 2.2, v: 6 + R0() * 18, a: 0.12 + R0() * 0.35, ph: R0() * 6 }));

function background(t) {
  let g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, P.top); g.addColorStop(0.45, P.mid); g.addColorStop(1, P.bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // soft haze blobs (caustic feel)
  for (const b of blobs) {
    const x = (b.x + b.vx * t + W) % (W + 400) - 200, y = b.y + b.vy * t + Math.sin(t * 0.4 + b.ph) * 30;
    const rg = ctx.createRadialGradient(x, y, 0, x, y, b.r);
    rg.addColorStop(0, `rgba(${P.haze},0.07)`); rg.addColorStop(1, `rgba(${P.haze},0)`);
    ctx.fillStyle = rg; ctx.fillRect(x - b.r, y - b.r, b.r * 2, b.r * 2);
  }
  // light rays
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const r of rays) {
    const sway = Math.sin(t * 0.35 + r.ph) * 40, x0 = r.x + sway;
    const lg = ctx.createLinearGradient(0, 0, 0, 1500);
    lg.addColorStop(0, `rgba(${P.ray},${r.a * (0.75 + 0.25 * Math.sin(t * 0.8 + r.ph))})`); lg.addColorStop(1, `rgba(${P.ray},0)`);
    ctx.fillStyle = lg; ctx.beginPath();
    ctx.moveTo(x0, -20); ctx.lineTo(x0 + r.w, -20); ctx.lineTo(x0 + r.w + r.sk, 1500); ctx.lineTo(x0 + r.sk - r.w * 0.3, 1500); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // dust
  for (const d of dust) {
    const y = ((d.y - d.v * t) % H + H) % H, x = d.x + Math.sin(t * 0.5 + d.ph) * 12;
    ctx.fillStyle = `rgba(205,225,240,${d.a})`; ctx.beginPath(); ctx.arc(x, y, d.r, 0, 7); ctx.fill();
  }
  // bottom vignette
  g = ctx.createLinearGradient(0, H * 0.62, 0, H); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = g; ctx.fillRect(0, H * 0.62, W, H * 0.38);
}

function surfaceLines(t, a) {
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(200,240,245,0.35)'; ctx.lineWidth = 2.5;
  for (let k = 0; k < 3; k++) {
    ctx.beginPath();
    for (let x = 0; x <= W; x += 12) { const y = 205 + k * 26 + Math.sin(x / 90 + t * 1.3 + k) * 6; x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- title block (top) ----------
function titleBlock(t, t0, title, sub, o = {}) {
  const k = easeOut(appear(t, t0, 0.5)), y = o.y || 375;
  ctx.save(); ctx.globalAlpha *= k; ctx.translate(0, (1 - k) * 18);
  text(title, W / 2, y, { size: o.size || 92, weight: 900, color: P.title, glow: P.accentGlow, maxW: 980 });
  ctx.fillStyle = P.accent; ctx.globalAlpha *= 0.9; rr(W / 2 - 60, y + 30, 120, 5, 2.5); ctx.fill(); ctx.globalAlpha /= 0.9;
  if (sub) text(sub, W / 2, y + 92, { size: 40, weight: 500, color: P.sub, maxW: 960 });
  ctx.restore();
}
function subSwap(t, tSwap, a, b, t0, y = 467) { // crossfade subtitle text
  const k = ease((t - tSwap) / 0.3);
  ctx.save(); ctx.globalAlpha *= easeOut(appear(t, t0, 0.5));
  if (k < 1) text(a, W / 2, y, { size: 40, weight: 500, color: P.sub, alpha: 1 - k, maxW: 960 });
  if (k > 0) text(b, W / 2, y, { size: 40, weight: 500, color: P.sub, alpha: k, maxW: 960 });
  ctx.restore();
}

// ---------- illustrations ----------
function flask(cx, cy, s, t) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  const body = () => { ctx.beginPath(); ctx.moveTo(-30, -150); ctx.lineTo(-30, -55); ctx.lineTo(-125, 92); ctx.quadraticCurveTo(-132, 112, -110, 112); ctx.lineTo(110, 112); ctx.quadraticCurveTo(132, 112, 125, 92); ctx.lineTo(30, -55); ctx.lineTo(30, -150); ctx.closePath(); };
  ctx.save(); body(); ctx.clip();
  const ly = 15 + Math.sin(t * 2) * 3;
  const lg = ctx.createLinearGradient(0, ly, 0, 112); lg.addColorStop(0, 'rgba(185,170,255,0.75)'); lg.addColorStop(1, 'rgba(120,100,230,0.85)');
  ctx.fillStyle = lg; ctx.beginPath(); ctx.moveTo(-140, 120);
  for (let x = -140; x <= 140; x += 10) ctx.lineTo(x, ly + Math.sin(x / 22 + t * 3) * 4);
  ctx.lineTo(140, 120); ctx.closePath(); ctx.fill();
  const R = rng(3);
  for (let i = 0; i < 9; i++) { const bx = -70 + R() * 140, sp = 25 + R() * 30, by = 108 - ((t * sp + R() * 100) % 90); ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.beginPath(); ctx.arc(bx, by, 3 + R() * 3, 0, 7); ctx.fill(); }
  ctx.restore();
  body(); ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(236,236,255,0.92)'; ctx.lineWidth = 7; ctx.shadowColor = P.accentGlow; ctx.shadowBlur = 22; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-44, -150); ctx.lineTo(44, -150); ctx.stroke();
  ctx.restore();
}

function faucet(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const mg = ctx.createLinearGradient(0, -40, 0, 40); mg.addColorStop(0, P.steel1); mg.addColorStop(1, P.steel2);
  ctx.fillStyle = mg;
  rr(-330, -34, 300, 68, 18); ctx.fill();                     // horizontal pipe
  rr(-360, -60, 40, 120, 10); ctx.fill();                     // wall flange
  ctx.beginPath(); ctx.moveTo(-40, -34); ctx.quadraticCurveTo(50, -34, 50, 40); ctx.lineTo(50, 92); ctx.lineTo(-10, 92); ctx.lineTo(-10, 40); ctx.quadraticCurveTo(-10, 30, -40, 34); ctx.closePath(); ctx.fill(); // spout
  rr(-205, -92, 30, 60, 8); ctx.fill(); rr(-250, -112, 120, 30, 15); ctx.fill(); // handle
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; rr(-320, -26, 270, 10, 5); ctx.fill();
  ctx.restore();
}

function glass(cx, top, t, fill = 0.7) {
  const wT = 270, wB = 220, h = 320;
  const path = () => { ctx.beginPath(); ctx.moveTo(cx - wT / 2, top); ctx.lineTo(cx - wB / 2, top + h); ctx.lineTo(cx + wB / 2, top + h); ctx.lineTo(cx + wT / 2, top); };
  ctx.save(); path(); ctx.closePath(); ctx.clip();
  const wy = top + h * (1 - fill);
  const g = ctx.createLinearGradient(0, wy, 0, top + h); g.addColorStop(0, P.waterTop); g.addColorStop(1, P.waterBot);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx - 200, top + h + 10);
  for (let x = cx - 200; x <= cx + 200; x += 10) ctx.lineTo(x, wy + Math.sin(x / 25 + t * 6) * 4);
  ctx.lineTo(cx + 200, top + h + 10); ctx.closePath(); ctx.fill();
  ctx.restore();
  path(); ctx.strokeStyle = 'rgba(236,238,255,0.85)'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(cx - wT / 2 + 26, top + 30); ctx.lineTo(cx - wB / 2 + 22, top + h - 30); ctx.stroke();
}

function stream(x, y0, y1, t, a = 1) {
  ctx.save(); ctx.globalAlpha *= a;
  const g = ctx.createLinearGradient(x - 14, 0, x + 14, 0); g.addColorStop(0, 'rgba(150,200,235,0.55)'); g.addColorStop(0.5, 'rgba(230,245,255,0.9)'); g.addColorStop(1, 'rgba(150,200,235,0.55)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x - 13, y0);
  for (let y = y0; y <= y1; y += 10) ctx.lineTo(x - 11 + Math.sin(y / 30 - t * 14) * 1.6, y);
  for (let y = y1; y >= y0; y -= 10) ctx.lineTo(x + 11 + Math.sin(y / 30 - t * 14 + 1) * 1.6, y);
  ctx.closePath(); ctx.fill(); ctx.restore();
}

function clWisp(x, y, t, seed, a) {
  const R = rng(seed);
  for (let i = 0; i < 7; i++) {
    const ph = R() * 10, sp = 40 + R() * 40, life = ((t * sp / 260 + R()) % 1);
    const px = x + (R() - .5) * 180 + Math.sin(t * 1.4 + ph) * 26, py = y - life * 300;
    const al = a * Math.sin(life * Math.PI) * 0.85;
    ctx.save(); ctx.globalAlpha *= al; ctx.strokeStyle = P.cl; ctx.lineWidth = 3; ctx.shadowColor = P.clGlow; ctx.shadowBlur = 12;
    ctx.beginPath(); for (let k = 0; k < 18; k++) { const yy = py + k * 5, xx = px + Math.sin(k / 3 + t * 3 + ph) * 10; k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke();
    if (i % 2 === 0) text('Cl', px + 26, py + 10, { size: 34, weight: 800, color: P.cl, glow: P.clGlow, blur: 14 });
    ctx.restore();
  }
}

function shield(cx, cy, s, a) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(0, -230); ctx.quadraticCurveTo(110, -170, 200, -175); ctx.quadraticCurveTo(205, 110, 0, 240); ctx.quadraticCurveTo(-205, 110, -200, -175); ctx.quadraticCurveTo(-110, -170, 0, -230); ctx.closePath();
  ctx.fillStyle = 'rgba(160,140,255,0.10)'; ctx.fill();
  ctx.strokeStyle = P.accent; ctx.lineWidth = 9; ctx.shadowColor = P.accentGlow; ctx.shadowBlur = 30; ctx.stroke();
  ctx.restore();
}

function lens(cx, cy, r, t, inside) {
  // handle
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.PI * 0.75);
  const hg = ctx.createLinearGradient(0, -24, 0, 24); hg.addColorStop(0, '#9aa1b3'); hg.addColorStop(0.5, '#5b6274'); hg.addColorStop(1, '#3a404f');
  ctx.fillStyle = hg; rr(r + 4, -22, 250, 44, 20); ctx.fill(); ctx.restore();
  // glass + content
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
  g.addColorStop(0, 'rgba(130,205,225,0.95)'); g.addColorStop(1, 'rgba(38,110,140,0.97)');
  ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, 2 * r, 2 * r);
  ctx.strokeStyle = 'rgba(255,255,255,0.13)'; ctx.lineWidth = 5;
  for (let k = 0; k < 9; k++) { ctx.beginPath(); for (let a = 0; a < 7; a += 0.3) { const rr2 = 30 + k * 34 + Math.sin(a * 3 + t * 1.1 + k) * 14; const x = cx - 80 + k * 22 + Math.cos(a) * rr2, y = cy - 60 + k * 15 + Math.sin(a) * rr2 * 0.6; a ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); }
  inside(cx, cy, r);
  ctx.restore();
  // rim
  const rg = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r); rg.addColorStop(0, P.steel1); rg.addColorStop(1, P.steel2);
  ctx.strokeStyle = rg; ctx.lineWidth = 26; ctx.beginPath(); ctx.arc(cx, cy, r + 10, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(cx, cy, r + 10, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
}

function particle(x, y, r, minus = 1) {
  const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, 1, x, y, r);
  g.addColorStop(0, P.dirtHi); g.addColorStop(1, P.dirt);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  if (minus > 0.02 && r >= 9) { ctx.save(); ctx.globalAlpha *= minus; ctx.fillStyle = '#fff'; ctx.fillRect(x - r * 0.5, y - 2, r, 4); ctx.restore(); }
}

function floc(x, y, size, seed) {
  const R = rng(seed);
  for (let i = 0; i < 9; i++) {
    const a = R() * 7, d = R() * size * 0.6, rr2 = size * (0.25 + R() * 0.3);
    ctx.fillStyle = `rgba(${150 + R() * 30 | 0},${118 + R() * 20 | 0},${82 + R() * 20 | 0},0.92)`;
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, rr2, 0, 7); ctx.fill();
  }
}

function tank(x, y, w, h, t, inside, waterTint = 0) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const wy = y + 40;
  const g = ctx.createLinearGradient(0, wy, 0, y + h);
  g.addColorStop(0, `rgba(${lerp(110, 140, waterTint)},${lerp(175, 215, waterTint)},${lerp(205, 230, waterTint)},0.88)`); g.addColorStop(1, P.waterBot);
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(x, y + h);
  for (let xx = x; xx <= x + w; xx += 12) ctx.lineTo(xx, wy + Math.sin(xx / 40 + t * 3) * 5);
  ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 4;
  for (let k = 0; k < 6; k++) { ctx.beginPath(); for (let xx = x; xx <= x + w; xx += 20) { const yy = wy + 70 + k * 70 + Math.sin(xx / 70 + t * 1.2 + k) * 12; xx === x ? ctx.moveTo(xx, yy) : ctx.lineTo(xx, yy); } ctx.stroke(); }
  inside(wy);
  ctx.restore();
  ctx.strokeStyle = '#9aa2b2'; ctx.lineWidth = 14; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(x - 7, y - 10); ctx.lineTo(x - 7, y + h + 7); ctx.lineTo(x + w + 7, y + h + 7); ctx.lineTo(x + w + 7, y - 10); ctx.stroke();
}

function mixer(cx, top, bottom, t, speed) {
  ctx.fillStyle = '#7d8596'; rr(cx - 50, top - 70, 100, 62, 10); ctx.fill();
  ctx.fillStyle = '#aab2c2'; rr(cx - 50, top - 70, 100, 14, 6); ctx.fill();
  ctx.fillStyle = '#c3c9d6'; ctx.fillRect(cx - 6, top - 8, 12, bottom - top);
  const a = t * speed;
  for (let k = 0; k < 2; k++) {
    const ang = a + k * Math.PI, wdt = Math.cos(ang) * 78;
    ctx.fillStyle = k ? '#b9c0ce' : '#9aa2b2';
    ctx.beginPath(); ctx.ellipse(cx + wdt / 2, bottom, Math.abs(wdt / 2) + 3, 16, 0, 0, 7); ctx.fill();
  }
}

function microbe(x, y, ang, s, a, wig) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.strokeStyle = 'rgba(246,198,224,0.8)'; ctx.lineWidth = 2.5; ctx.beginPath();
  for (let k = 0; k < 14; k++) { const xx = -46 - k * 4, yy = Math.sin(k / 2 + wig) * 6; k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy); } ctx.stroke();
  rr(-46, -17, 92, 34, 17); ctx.fillStyle = P.microbe; ctx.fill(); ctx.strokeStyle = P.microbeEdge; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = 'rgba(150,60,110,0.6)'; for (const [dx, dy, r] of [[-14, 3, 5], [4, -4, 4], [18, 5, 6]]) { ctx.beginPath(); ctx.arc(dx, dy, r, 0, 7); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,0.45)'; rr(-30, -9, 50, 6, 3); ctx.fill();
  ctx.restore();
}

function membrane(cx, cy, w, t, a = 1) {
  ctx.save(); ctx.globalAlpha *= a;
  const R = rng(11), x0 = cx - w / 2;
  // dirty side particles + microbes bouncing above
  for (let i = 0; i < 14; i++) { const px = x0 + 30 + R() * (w - 60), ph = R() * 7, py = cy - 70 - Math.abs(Math.sin(t * 1.6 + ph)) * 110; particle(px, py, 9 + R() * 8, 0); }
  for (let i = 0; i < 3; i++) { const ph = R() * 7; microbe(x0 + 120 + i * 260 + Math.sin(t + ph) * 30, cy - 120 - Math.abs(Math.sin(t * 1.2 + ph)) * 70, Math.sin(t + ph) * 0.4, 0.75, 1, t * 5 + ph); }
  // membrane band with pores
  ctx.fillStyle = 'rgba(180,240,240,0.18)'; rr(x0, cy - 20, w, 40, 10); ctx.fill();
  ctx.strokeStyle = P.accent; ctx.lineWidth = 5; ctx.shadowColor = P.accentGlow; ctx.shadowBlur = 16;
  for (let x = x0; x < x0 + w; x += 36) { ctx.beginPath(); ctx.moveTo(x + 6, cy - 20); ctx.lineTo(x + 26, cy - 20); ctx.moveTo(x + 6, cy + 20); ctx.lineTo(x + 26, cy + 20); ctx.stroke(); }
  ctx.shadowBlur = 0;
  // clean water drops passing through
  for (let i = 0; i < 18; i++) { const px = x0 + 36 * (1 + (i * 7) % (w / 36 - 1)) - 0, life = (t * 0.55 + R()) % 1, py = cy - 120 + life * 300; ctx.fillStyle = `rgba(170,225,255,${0.8 * Math.sin(life * Math.PI)})`; ctx.beginPath(); ctx.arc(px - 20, py, 7, 0, 7); ctx.fill(); }
  ctx.restore();
}

// ---------- scenes ----------
const R1 = rng(42);
const parts = Array.from({ length: 34 }, () => ({ x: (R1() - .5) * 2, y: (R1() - .5) * 2, r: 6 + R1() * 9, ph: R1() * 7, cl: 0 }));
// assign floc clusters for scene E
const centers = [[-0.45, -0.35], [0.35, -0.4], [-0.2, 0.25], [0.45, 0.3], [0.0, -0.05]];
parts.forEach((p, i) => p.cl = i % centers.length);
const tankParts = Array.from({ length: 40 }, () => ({ x: R1(), y: R1(), r: 6 + R1() * 7, ph: R1() * 7 }));
const bugs = Array.from({ length: 7 }, (_, i) => ({ x: (R1() - .5) * 1.3, y: (R1() - .5) * 1.3, ang: R1() * 6, ph: R1() * 7, die: 33.4 + i * 0.32 + R1() * 0.2 }));

// ---------- part 4 helpers ----------
function drop(x, y, r, col = 'rgba(170,225,255,0.95)') {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y - r * 1.6);
  ctx.bezierCurveTo(x + r * 0.9, y - r * 0.4, x + r, y + r * 0.2, x + r, y + r * 0.35);
  ctx.arc(x, y + r * 0.35, r, 0, Math.PI); ctx.bezierCurveTo(x - r, y + r * 0.2, x - r * 0.9, y - r * 0.4, x, y - r * 1.6); ctx.fill();
}
function virus(x, y, r, a = 1) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = '#F6C6E0'; ctx.lineWidth = 3;
  for (let k = 0; k < 10; k++) { const an = k / 10 * 6.283; ctx.beginPath(); ctx.moveTo(x + Math.cos(an) * r, y + Math.sin(an) * r); ctx.lineTo(x + Math.cos(an) * r * 1.45, y + Math.sin(an) * r * 1.45); ctx.stroke();
    ctx.fillStyle = '#F6C6E0'; ctx.beginPath(); ctx.arc(x + Math.cos(an) * r * 1.5, y + Math.sin(an) * r * 1.5, 3.5, 0, 7); ctx.fill(); }
  ctx.fillStyle = P.microbe; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function ion(x, y, r, lab, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  text(lab, x, y + r * 0.38, { size: r * 0.95, weight: 800, color: '#0b1f33' });
}
function cartridge(x, y, w, h, label) {
  const g = ctx.createLinearGradient(x, 0, x + w, 0); g.addColorStop(0, '#9aa3b4'); g.addColorStop(0.35, '#F1F4F8'); g.addColorStop(1, '#8a92a4');
  ctx.fillStyle = '#6f7789'; rr(x - 8, y - 26, w + 16, 34, 10); ctx.fill();
  ctx.fillStyle = g; rr(x, y, w, h, 22); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.55)'; rr(x + w * 0.22, y + 20, 10, h - 40, 5); ctx.fill();
  if (label) text(label, x + w / 2, y + h / 2 + 12, { size: 34, weight: 900, color: '#2b3446' });
}
function pipe(pts, t, flow = true) {
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(220,235,245,0.55)'; ctx.lineWidth = 16; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  if (flow) { ctx.strokeStyle = P.accent; ctx.lineWidth = 6; ctx.setLineDash([18, 26]); ctx.lineDashOffset = -t * 90; ctx.stroke(); }
  ctx.restore();
}
function hairLens(cx, cy, r, t) {
  lens(cx, cy, r, t, (x0, y0, rr0) => {
    ctx.save(); ctx.translate(x0, y0); ctx.rotate(-0.55);
    const hw = rr0 * 0.62;
    const g = ctx.createLinearGradient(0, -hw / 2, 0, hw / 2); g.addColorStop(0, '#5a3d28'); g.addColorStop(0.45, '#9b7150'); g.addColorStop(1, '#4a3120');
    ctx.fillStyle = g; ctx.fillRect(-rr0 * 1.5, -hw / 2, rr0 * 3, hw);
    ctx.strokeStyle = 'rgba(40,25,15,0.45)'; ctx.lineWidth = 3;
    for (let k = -12; k < 12; k++) { const xx = k * 34 + (t * 6 % 34); ctx.beginPath(); ctx.moveTo(xx, -hw / 2); ctx.quadraticCurveTo(xx + 22, 0, xx, hw / 2); ctx.stroke(); }
    ctx.restore();
    // the membrane pore: a tiny glowing dot
    const px = x0 + rr0 * 0.5, py = y0 + rr0 * 0.62, pk = ease((t - 4.8) / 0.6);
    if (pk > 0) { ctx.save(); ctx.globalAlpha *= pk; ctx.fillStyle = P.accent; ctx.shadowColor = P.accentGlow; ctx.shadowBlur = 18; ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
      ctx.strokeStyle = P.accent; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px, py, 22 + Math.sin(t * 5) * 4, 0, 7); ctx.stroke(); ctx.restore(); }
  });
}
function membraneIcon(cx, cy, s, t) {      // spiral-wound membrane module
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
  const g = ctx.createLinearGradient(0, -90, 0, 90); g.addColorStop(0, '#E6ECF3'); g.addColorStop(1, '#7E8597');
  ctx.fillStyle = g; rr(-200, -90, 360, 180, 30); ctx.fill();
  ctx.fillStyle = '#c9d1dc'; ctx.beginPath(); ctx.ellipse(160, 0, 48, 90, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = P.accent; ctx.lineWidth = 5; ctx.shadowColor = P.accentGlow; ctx.shadowBlur = 16; ctx.beginPath();
  for (let a = 0; a < 6.283 * 3.2; a += 0.15) { const r = 6 + a * 4.1; ctx.lineTo(160 + Math.cos(a + t) * r * 0.55, Math.sin(a + t) * r); } ctx.stroke();
  ctx.restore();
  for (let i = 0; i < 5; i++) { const life = (t * 0.7 + i / 5) % 1; ctx.save(); ctx.globalAlpha *= Math.sin(life * Math.PI); drop(cx + 210 * s + life * 140, cy, 12); ctx.restore(); }
}
function gauge(cx, cy, r, t, k) {
  ctx.fillStyle = '#E9EDF3'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#7E8597'; ctx.lineWidth = 12; ctx.stroke();
  ctx.strokeStyle = '#E2574C'; ctx.lineWidth = 14; ctx.beginPath(); ctx.arc(cx, cy, r - 22, Math.PI * 1.75, Math.PI * 2.15); ctx.stroke();
  ctx.strokeStyle = '#2b3446'; ctx.lineWidth = 4;
  for (let i = 0; i <= 8; i++) { const a = Math.PI * (0.85 + i * 0.1625); ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (r - 14), cy + Math.sin(a) * (r - 14)); ctx.lineTo(cx + Math.cos(a) * (r - 34), cy + Math.sin(a) * (r - 34)); ctx.stroke(); }
  const a = Math.PI * (0.9 + 1.15 * k) + Math.sin(t * 9) * 0.03;
  ctx.strokeStyle = '#E2574C'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * (r - 30), cy + Math.sin(a) * (r - 30)); ctx.stroke();
  ctx.fillStyle = '#2b3446'; ctx.beginPath(); ctx.arc(cx, cy, 12, 0, 7); ctx.fill();
}
function bolt(cx, cy, s, a) {
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(cx, cy); ctx.scale(s, s);
  ctx.fillStyle = '#FFD45A'; ctx.shadowColor = 'rgba(255,212,90,0.9)'; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.moveTo(10, -70); ctx.lineTo(-35, 8); ctx.lineTo(-2, 8); ctx.lineTo(-14, 70); ctx.lineTo(36, -12); ctx.lineTo(4, -12); ctx.closePath(); ctx.fill(); ctx.restore();
}
function cup(cx, top, w, h, fill, dirty, t) {
  const path = () => { ctx.beginPath(); ctx.moveTo(cx - w / 2, top); ctx.lineTo(cx - w * 0.4, top + h); ctx.lineTo(cx + w * 0.4, top + h); ctx.lineTo(cx + w / 2, top); };
  ctx.save(); path(); ctx.closePath(); ctx.clip();
  const wy = top + h * (1 - fill);
  ctx.fillStyle = dirty ? 'rgba(150,160,170,0.75)' : P.waterTop; ctx.beginPath(); ctx.moveTo(cx - w, top + h + 5);
  for (let x = cx - w; x <= cx + w; x += 8) ctx.lineTo(x, wy + Math.sin(x / 14 + t * 5) * 2.5);
  ctx.lineTo(cx + w, top + h + 5); ctx.closePath(); ctx.fill(); ctx.restore();
  path(); ctx.strokeStyle = 'rgba(236,238,255,0.85)'; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.stroke();
}
function sea(x, y, w, h, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y - 30, w, h + 30); ctx.clip();
  for (let k = 0; k < 4; k++) {
    ctx.fillStyle = ['rgba(40,120,170,0.9)', 'rgba(30,100,150,0.9)', 'rgba(22,80,128,0.95)', 'rgba(14,60,100,1)'][k];
    ctx.beginPath(); ctx.moveTo(x, y + h);
    for (let xx = x; xx <= x + w; xx += 10) ctx.lineTo(xx, y + k * 45 + Math.sin(xx / 45 + t * (1.6 + k * 0.3) + k) * 14);
    ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function ladderRow(row, y, t) {
  const k = easeBack(appear(t, row.t0, 0.5)); if (k <= 0) return;
  const live = t >= row.t0, hi = ladder.filter(r => t >= r.t0).pop() === row;
  ctx.save(); ctx.globalAlpha *= clamp(k); ctx.translate(0, (1 - clamp(k)) * 30);
  ctx.fillStyle = hi ? 'rgba(14,40,52,0.72)' : 'rgba(14,30,40,0.5)'; rr(60, y, 960, 250, 34); ctx.fill();
  ctx.strokeStyle = hi ? P.accent : 'rgba(127,227,224,0.3)'; ctx.lineWidth = hi ? 4 : 2; ctx.stroke();
  text(row.name, 100, y + 82, { size: 50, weight: 900, color: P.title, align: 'left', maxW: 520 });
  text(row.size, 100, y + 144, { size: 40, weight: 800, color: P.accent, align: 'left' });
  text('✕ ' + row.stops, 100, y + 204, { size: 34, weight: 700, color: P.sub, align: 'left' });
  // mini membrane: dirty side left, clean side right
  const mx = 820, x0 = 640, x1 = 990, cy = y + 125;
  ctx.save(); ctx.beginPath(); rr(x0, y + 14, x1 - x0, 222, 24); ctx.clip();
  ctx.fillStyle = 'rgba(60,130,160,0.35)'; ctx.fillRect(x0, y, x1 - x0, 250);
  const R = rng(30 + row.kind);
  for (let i = 0; i < 5; i++) {
    const ph = R() * 7, by = cy - 80 + i * 40, bx = mx - 34 - Math.abs(Math.sin(t * 2 + ph)) * 110;
    if (row.kind === 0) (i % 2 ? particle(bx, by, 13, 0) : microbe(bx - 10, by, 0.2, 0.42, 1, t * 6 + ph));
    else if (row.kind === 1) virus(bx, by, 11);
    else ion(bx, by, 15, i % 2 ? 'Cl' : 'Na', i % 2 ? '#CFEA72' : '#FFD45A');
  }
  for (let i = 0; i < 6; i++) { const life = (t * 0.6 + i / 6) % 1, dy = cy - 85 + (i * 37) % 180; ctx.save(); ctx.globalAlpha *= Math.sin(life * Math.PI); drop(lerp(x0 + 20, x1 - 10, life), dy, 9); ctx.restore(); }
  ctx.restore();
  ctx.strokeStyle = P.accent; ctx.lineWidth = 6; ctx.shadowColor = P.accentGlow; ctx.shadowBlur = 14; ctx.setLineDash([22 - row.kind * 7, 6 + row.kind * 2]);
  ctx.beginPath(); ctx.moveTo(mx, y + 18); ctx.lineTo(mx, y + 232); ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur = 0;
  ctx.restore();
}

        text(`${s} tozalash`, x0 + 280, y + 16, { size: 44, weight: 800, color: on > 0.5 ? P.title : P.sub, align: 'left', maxW: 360 });
      });
      const dk = ease((t - 54.4) / 3.4); drop(x0, lerp(560, 1150, dk), 22);
      const gk = easeBack(appear(t, 58.6, 0.6));
      if (gk > 0) { ctx.save(); ctx.globalAlpha *= clamp(gk); ctx.translate(W / 2, 1300); ctx.scale(0.55 * gk, 0.55 * gk); ctx.translate(-W / 2, -1300); glass(W / 2, 1180, t, 0.72); ctx.restore(); }
      ctx.restore();
  } },
  { s: 62.3, e: END + 1, draw(t) {                              // K — value water + follow + goodbye
      const k = easeOut(appear(t, 62.4, 0.6));
      ctx.save(); ctx.globalAlpha *= k;
      text('SUVNI', W / 2, 520, { size: 120, weight: 900, color: '#FFFFFF', glow: 'rgba(255,255,255,0.35)', blur: 20 });
      text('QADRIGA YETING', W / 2, 650, { size: 104, weight: 900, color: P.accent, glow: P.accentGlow, maxW: 980 });
      const gy = 760;
      glass(W / 2, gy, t, 0.72);
      ctx.restore();
      const fk = easeBack(appear(t, 64.97, 0.55));
      if (fk > 0) {
        ctx.save(); ctx.globalAlpha *= clamp(fk); ctx.translate(W / 2, 1270); ctx.scale(0.9 + 0.1 * fk, 0.9 + 0.1 * fk); ctx.translate(-W / 2, -1270);
        ctx.fillStyle = 'rgba(14,40,52,0.75)'; rr(W / 2 - 380, 1170, 760, 200, 100); ctx.fill(); ctx.strokeStyle = P.accent; ctx.lineWidth = 4; ctx.stroke();
        text('@the.waterengineer', W / 2, 1258, { size: 58, weight: 900, color: P.title, glow: P.accentGlow, blur: 18 });
        subSwap(t, 73.7, 'suv haqida, oddiy tilda', 'koʻrishguncha, salomat boʻling!', 64.97, 1325);

      }

];

// ---------- captions (karaoke, part 2 style) ----------
function captions(t) {
  if (t < 1.6) return;
  const ch = CHUNKS.find(c => t >= c.s && t < c.e); if (!ch) return;
  const ws = []; for (let i = ch.i0; i <= ch.i1; i++) ws.push(WORDS[i]);
  ctx.save(); ctx.font = '800 60px Inter';
  const sp = ctx.measureText(' ').width, widths = ws.map(w => ctx.measureText(w.d).width), total = widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  let scale = Math.min(1, 960 / total);
  const k = easeOut((t - ch.s) / 0.12);
  ctx.translate(W / 2, 1560); ctx.scale(scale * (0.94 + 0.06 * k), scale * (0.94 + 0.06 * k)); ctx.globalAlpha = Math.min(1, (t - ch.s) / 0.12 + 0.0001) > 0 ? k * ease((t - 1.6) / 0.25) : 0;
  let x = -total / 2;
  ws.forEach((w, i) => {
    const active = t >= w.s && (t < w.e || i === ws.length - 1 || t < ws[i + 1].s);
    const spoken = t >= w.s;
    ctx.textAlign = 'left'; ctx.shadowColor = 'rgba(0,0,0,0.65)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 3;
    ctx.fillStyle = active ? P.accent : (spoken ? '#FFFFFF' : 'rgba(255,255,255,0.92)');
    ctx.fillText(w.d, x, 0); x += widths[i] + sp;
  });
  ctx.restore();
}

// ---------- frame ----------
const FADE = 0.35;
window.render = function (t) {
  ctx.globalAlpha = 1; background(t);
  const tm = mapT(t);
  const layers = SCENES.map(s => [s, tm]).concat(FINALE.map(s => [s, t]));
  for (const [s, tt] of layers) {
    if (tt < s.s - 0.001 || tt > s.e + FADE) continue;
    const a = (s.s === 0 ? 1 : ease((tt - s.s - 0.12) / 0.3)) * (1 - ease((tt - s.e) / 0.25));
    if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a; s.draw(tt); ctx.restore();
  }
  captions(t);
  const fo = ease((t - (END - 0.5)) / 0.5); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = Promise.all([500, 700, 800, 900].map(w => document.fonts.load(`${w} 60px Inter`, 'Aaʻʼ'))).then(() => true);
